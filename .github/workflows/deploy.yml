name: Build and deploy

# The demo is built from source on every push, so it cannot drift from the code, and it
# cannot be published unless the type check and the whole test suite pass first.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege by default. The build job runs on pull requests, over code the contributor
# controls, so it gets nothing but the right to read the checkout. Publishing rights are
# granted to the deploy job alone, which runs no contributor code.
permissions:
  contents: read

# One deployment at a time, and never cancel one that has already started: a half-finished
# deployment would leave the published site in an unknown state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build the single file
        run: npm run build

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp release/compass-error.html _site/index.html

      # The build already refuses to write a page that fetches anything; this runs the same
      # check once more against the exact bytes about to be published.
      - name: Check the published page is self-contained
        run: node scripts/assert-self-contained.mjs _site/index.html

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    name: Deploy to Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
