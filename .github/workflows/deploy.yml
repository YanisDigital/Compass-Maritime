name: Build and deploy

# The demo is built from source on every push, so it cannot drift from the code, and it
# cannot be published unless the type check and the whole test suite pass first.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes one still in flight.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build the single file
        run: npm run build

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp release/compass-error.html _site/index.html

      - name: Check the published page is self-contained
        run: |
          if grep -oE '(src|href)="[^"]+"' _site/index.html | grep -v 'data:'; then
            echo "::error::The page still references an external file."
            exit 1
          fi
          echo "No external references."

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push'
        with:
          path: _site

  deploy:
    name: Deploy to Pages
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
